# First-party applications. A separate workspace from agentwarecore because
# apps are clients of the display protocol, not parts of the system: they link
# awproto, and awkit when they need a dialog, and none of them may know the
# compositor's internals. Keeping them out of the core workspace makes that boundary a
# directory rather than a convention.
[workspace]
resolver = "3"
members = ["awcalc", "awfiles", "awsheet", "awtext"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

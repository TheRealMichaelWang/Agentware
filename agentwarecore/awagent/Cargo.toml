[package]
name = "awagent"
version = "0.1.0"
edition = "2024"

# The per-turn worker: one prompt, one agentic loop against a model, then gone.
# It owns nothing durable, exits when its turn is finished, and is never
# restarted.
#
# This is the one crate in the system that talks to the outside world, so it is
# the one crate that carries the machinery for it: rustls with the ring
# provider (builds cleanly for musl), the webpki CA bundle compiled in (the
# image has no /etc/ssl), and serde_json for the request bodies and streamed
# events an LLM API speaks. PID 1 and awproto stay dependency-free; nothing
# here is reachable from any other process.
[dependencies]
awproto = { path = "../awproto" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde_json = "1"
# For one call: waiting on the model's socket and the haimanager's at once,
# so a change in the workspace can end a model exchange rather than wait for
# it. The same crate awproto already carries, with the one feature it needs.
rustix = { version = "1.1.4", default-features = false, features = ["std", "event"] }

[package]
name = "haimanager"
version = "0.1.0"
edition = "2024"

[dependencies]
# The DRM ioctl structures are hand-declared in `drm/mod.rs` rather than pulled
# from a crate. They are stable kernel uapi, the set we need is small, and the
# haimanager is the process that owns the screen: a black screen with no error
# is the worst thing to debug, so the ioctl layer is worth being able to read in
# full.
libc = "0.2"
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process"] }
awproto = { path = "../awproto" }
fontdue = "0.9.4"
# The path-and-gradient rasterizer behind Canvas. Everything it renders lands in
# a small scratch pixmap that one blend loop composites onto the XRGB frame, so
# the flat-fill fast paths, the cursor overlay and the dirty-rectangle
# discipline never depend on it. png-format is on for one reason: a wallpaper
# may be a photograph, and PNG is the one raster format the compositor reads.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
# Renders app icons and vector wallpapers, which are SVG so one file serves
# every size chrome needs. Default features off: icons are paths, not
# documents, so no text layout, no system fonts, and no embedded raster images.
resvg = { version = "0.45", default-features = false }

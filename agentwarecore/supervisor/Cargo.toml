[package]
name = "supervisor"
version = "0.1.0"
edition = "2024"

[dependencies]
# Safe wrappers over the Linux syscalls we need: mount, waitpid, epoll, reboot.
rustix = { version = "1.1.4", features = [
    "event",
    "fs",
    "mount",
    "net",
    "pipe",
    "process",
    "system",
    "thread",
] }
# Used only by `signals.rs`. rustix deliberately does not wrap signalfd or
# sigprocmask, so that one module drops to raw libc.
libc = "0.2"
awproto = { path = "../awproto" }

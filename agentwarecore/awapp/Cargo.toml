[package]
name = "awapp"
version = "0.1.0"
edition = "2024"

# The reference client for the display protocol, and the only thing that draws
# anything until real applications exist. It links awproto and nothing else,
# which is the point: an application needs a socket it was handed and a way to
# format markup, and no access to the display, the input devices or the
# filesystem.
[dependencies]
awproto = { path = "../awproto" }
